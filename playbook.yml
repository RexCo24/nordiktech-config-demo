---
- name: Nordiktech nginx Playbook
  hosts: local
  become: yes
  tasks:

    - name: Install nginx
      apt:
        name: nginx
        state: present

    - name: Install python3-venv
      apt:
        name: python3.12-venv
        state: present

    - name: Create app directory
      file:
        path: /opt/inventory
        state: directory

    - name: Copy app.py
      copy:
        src: app.py
        dest: /opt/inventory/app.py

    - name: Create venv
      command: python3 -m venv /opt/inventory/venv
      args:
        creates: /opt/inventory/venv

    - name: Install Flask in venv
      pip:
        name: flask
        virtualenv: /opt/inventory/venv

    - name: Deploy nginx config
      copy:
        src: nginx.conf
        dest: /etc/nginx/sites-available/nordiktech

    - name: Enable nginx site
      file:
        src: /etc/nginx/sites-available/nordiktech
        dest: /etc/nginx/sites-enabled/nordiktech
        state: link

    - name: Start nginx and enable autostart
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Deploy Flask systemd service
      copy:
        src: flask.service
        dest: /etc/systemd/system/flask.service

    - name: Start Flask service
      ansible.builtin.systemd_service:
        name: flask.service
        state: started
        enabled: true
        daemon_reload: true
